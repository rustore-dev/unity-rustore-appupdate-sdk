ext {
    rustore_appupdate_version = '10.5.1'
    sdk_version_code = 100501

    destination_project = '../ru.rustore.update'

    sdk_appupdate_dependency = "ru.rustore.sdk:appupdate:$rustore_appupdate_version"
    sdk_maven_repos = 'https://nexus-external.rustore.ru/repository/maven-rustore-exposed'
}
buildscript {
    ext.kotlin_version = "1.9.25"
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url = uri(sdk_maven_repos)
        }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
